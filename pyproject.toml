[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-glitch-filter"
version = "0.1.0"
description = "CPU detector and safe batch sorter for vertically smeared photos"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
photo-filter = "photo_filter.cli:main"

[tool.setuptools.packages.find]
include = ["photo_filter*"]
